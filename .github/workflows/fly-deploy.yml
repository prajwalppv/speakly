name: CI/CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      SPEAKLY_ENVIRONMENT: test
      SPEAKLY_DATABASE_URL: sqlite:///./app/data/test.db
      SPEAKLY_AUDIO_DIR: ./app/storage/audio
      SPEAKLY_LOG_LEVEL: INFO
      SPEAKLY_DEVELOPER_MODE: "true"
      ELEVENLABS_API_KEY: test
      ELEVENLABS_BASE_URL: https://api.elevenlabs.io
      ELEVENLABS_WEBHOOK_SECRET: test
      ELEVENLABS_WEBHOOK_ID: test
      ELEVENLABS_DIARIZATION_ENABLED: "false"
      ELEVENLABS_DIARIZATION_THRESHOLD: "0.4"
      GROQ_API_KEY: test
      GROQ_MODEL: deepseek-r1-distill-llama-70b
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL_SUMMARY: llama3
      OLLAMA_MODEL_TODO: llama3
      TICKTICK_ENABLED: "false"
      TICKTICK_CLIENT_ID: test
      TICKTICK_CLIENT_SECRET: test
      TICKTICK_REDIRECT_URI: http://localhost:8000/api/ticktick/callback
      TICKTICK_BASE_URL: https://api.ticktick.com/open/v1
      SPEAKLY_FEATURE_AUTO_TAGGING: "true"
      SPEAKLY_FEATURE_CUSTOM_TAGS: "true"
      SPEAKLY_FEATURE_ADVANCED_SEARCH: "true"
      SPEAKLY_FEATURE_REPORT_GENERATION: "false"
      SPEAKLY_FEATURE_COMMAND_PALETTE: "true"
      SPEAKLY_MAX_TAGS_PER_SESSION: "5"
      SPEAKLY_FREE_RECORDINGS_PER_MONTH: "10"
      SPEAKLY_FREE_TASKS_PER_SESSION: "3"
      SPEAKLY_FREE_TAGS_PER_SESSION: "3"
      PJ_PROFILE_NAME: PJ
      PJ_VOICE_TAGS: pj,patrick
      TODO_CONFIDENCE_THRESHOLD: "0.35"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Prepare runtime directories
        run: |
          mkdir -p app/data
          mkdir -p app/logs
          mkdir -p app/storage/audio

      - name: Run pytest suite
        run: uv run pytest

  build-frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build project
        run: npm run build

  ensure-postgres:
    name: Ensure Postgres DB is running
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Check and start Postgres machine
        run: |
          echo "Checking Postgres database status..."
          status=$(flyctl status --app speakly-db --json 2>&1 || echo '{"error": true}')

          if echo "$status" | jq -e '.error' > /dev/null 2>&1; then
            echo "Error fetching status. App may not exist or API token invalid."
            exit 1
          fi

          echo "Current status:"
          echo "$status" | jq '.'

          # Find machines that are not started
          stopped_machines=$(echo "$status" | jq -r '.Machines[]? | select(.state != "started") | .id' 2>/dev/null || echo "")

          if [ -n "$stopped_machines" ]; then
            echo "Found stopped machines. Starting them..."
            for machine_id in $stopped_machines; do
              echo "Starting machine: $machine_id"
              flyctl machine start "$machine_id" --app speakly-db
            done

            echo "Waiting for machines to be healthy..."
            sleep 10
            flyctl status --app speakly-db
          else
            echo "All Postgres machines are already running."
          fi

  deploy-backend:
    name: Deploy backend to Fly.io
    needs: ensure-postgres
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy backend
        run: |
          flyctl deploy \
            --app speakly-backend \
            --config fly.toml \
            --remote-only \
            --strategy immediate

      - name: Verify backend deployment
        run: |
          echo "Waiting for backend machines to become healthy..."

          TIMEOUT=600  # 10 minutes in seconds
          POLL_INTERVAL=15
          ELAPSED=0
          APP_NAME="speakly-backend"

          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "Checking status (${ELAPSED}s elapsed)..."

            status=$(flyctl status --app $APP_NAME --json 2>&1 || echo '{"error": true}')

            if echo "$status" | jq -e '.error' > /dev/null 2>&1; then
              echo "Error fetching status. Retrying..."
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi

            # Count machines by state
            total=$(echo "$status" | jq -r '.Machines | length')
            started=$(echo "$status" | jq -r '[.Machines[] | select(.state == "started")] | length')
            stopped=$(echo "$status" | jq -r '[.Machines[] | select(.state == "stopped")] | length')
            replacing=$(echo "$status" | jq -r '[.Machines[] | select(.state == "replacing")] | length')
            starting=$(echo "$status" | jq -r '[.Machines[] | select(.state == "starting")] | length')

            echo "  Total: $total | Started: $started | Starting: $starting | Replacing: $replacing | Stopped: $stopped"

            # Start any stopped machines
            if [ "$stopped" -gt 0 ]; then
              echo "Found stopped machines, starting them..."
              stopped_ids=$(echo "$status" | jq -r '.Machines[] | select(.state == "stopped") | .id')
              for machine_id in $stopped_ids; do
                echo "  Starting machine: $machine_id"
                flyctl machine start "$machine_id" --app $APP_NAME || true
              done
            fi

            # Check if all machines are started
            if [ "$started" -eq "$total" ] && [ "$total" -gt 0 ]; then
              echo "✅ All $total backend machines are running!"
              flyctl status --app $APP_NAME
              exit 0
            fi

            # Still transitioning, wait and retry
            echo "  Machines still transitioning. Waiting ${POLL_INTERVAL}s..."
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "❌ Timeout after ${TIMEOUT}s waiting for backend machines to start"
          flyctl status --app $APP_NAME
          exit 1

  deploy-frontend:
    name: Deploy frontend to Fly.io
    needs: ensure-postgres
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy frontend
        run: |
          flyctl deploy \
            --app speakly-frontend \
            --config frontend/fly.toml \
            --remote-only \
            --strategy immediate \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY="${VITE_CLERK_PUBLISHABLE_KEY}" \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}"

      - name: Verify frontend deployment
        run: |
          echo "Waiting for frontend machines to become healthy..."

          TIMEOUT=600  # 10 minutes in seconds
          POLL_INTERVAL=15
          ELAPSED=0
          APP_NAME="speakly-frontend"

          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "Checking status (${ELAPSED}s elapsed)..."

            status=$(flyctl status --app $APP_NAME --json 2>&1 || echo '{"error": true}')

            if echo "$status" | jq -e '.error' > /dev/null 2>&1; then
              echo "Error fetching status. Retrying..."
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
              continue
            fi

            # Count machines by state
            total=$(echo "$status" | jq -r '.Machines | length')
            started=$(echo "$status" | jq -r '[.Machines[] | select(.state == "started")] | length')
            stopped=$(echo "$status" | jq -r '[.Machines[] | select(.state == "stopped")] | length')
            replacing=$(echo "$status" | jq -r '[.Machines[] | select(.state == "replacing")] | length')
            starting=$(echo "$status" | jq -r '[.Machines[] | select(.state == "starting")] | length')

            echo "  Total: $total | Started: $started | Starting: $starting | Replacing: $replacing | Stopped: $stopped"

            # Start any stopped machines
            if [ "$stopped" -gt 0 ]; then
              echo "Found stopped machines, starting them..."
              stopped_ids=$(echo "$status" | jq -r '.Machines[] | select(.state == "stopped") | .id')
              for machine_id in $stopped_ids; do
                echo "  Starting machine: $machine_id"
                flyctl machine start "$machine_id" --app $APP_NAME || true
              done
            fi

            # Check if all machines are started
            if [ "$started" -eq "$total" ] && [ "$total" -gt 0 ]; then
              echo "✅ All $total frontend machines are running!"
              flyctl status --app $APP_NAME
              exit 0
            fi

            # Still transitioning, wait and retry
            echo "  Machines still transitioning. Waiting ${POLL_INTERVAL}s..."
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "❌ Timeout after ${TIMEOUT}s waiting for frontend machines to start"
          flyctl status --app $APP_NAME
          exit 1
