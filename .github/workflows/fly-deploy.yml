name: Deploy to Fly.io

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "fly.toml"
      - "frontend/fly.toml"
      - "deploy-production.sh"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

jobs:
  ensure-postgres:
    name: Ensure Postgres app is running
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_POSTGRES_APP: ${{ vars.FLY_POSTGRES_APP }}
    steps:
      - name: Check Postgres app name
        run: |
          if [ -z "$FLY_POSTGRES_APP" ]; then
            echo "FLY_POSTGRES_APP variable is not set. Configure it in repo variables." >&2
            exit 1
          fi

      - name: Verify Postgres app status
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Start Postgres machine if needed
        run: |
          status=$(flyctl status --app "$FLY_POSTGRES_APP" --json)
          echo "$status" | jq '.'
          running=$(echo "$status" | jq -r '[.Machines[]?.State == "started"] | all')
          if [ "$running" != "true" ]; then
            echo "Postgres not running, starting machines..."
            flyctl machines list --app "$FLY_POSTGRES_APP"
            flyctl machines start --app "$FLY_POSTGRES_APP" --all
            echo "Waiting for machines to become healthy..."
            flyctl status --app "$FLY_POSTGRES_APP"
          else
            echo "Postgres machines already running."
          fi

  deploy-backend:
    name: Deploy backend
    needs: ensure-postgres
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy backend app
        run: flyctl deploy --config fly.toml --remote-only --strategy immediate

  deploy-frontend:
    name: Deploy frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy frontend app
        run: |
          flyctl deploy \
            --config frontend/fly.toml \
            --remote-only \
            --strategy immediate \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY \
            --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL
